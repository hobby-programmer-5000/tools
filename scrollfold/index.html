<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'">
<meta name="color-scheme" content="light dark">
<title>Scrollfold</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon.png" type="image/png" sizes="256x256">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="app.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="icon.svg" alt="" width="28" height="28">
    <div>
      <h1>Scrollfold</h1>
      <p data-i18n="tagline"></p>
    </div>
  </div>
  <div class="top-actions">
    <span class="mode" id="mode"></span>
    <a class="ghost" id="repo-link" href="https://github.com/hobby-programmer-5000/scrollfold" target="_blank" rel="noopener" data-i18n="repo"></a>
    <button type="button" class="ghost" id="credits-btn" data-i18n="credits"></button>
    <button type="button" class="ghost" id="lang-btn"></button>
  </div>
</header>

<main class="layout">
  <aside class="panel" aria-label="Options">
    <label class="drop" id="drop" tabindex="0">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0-5 5m5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <span data-i18n="drop"></span>
      <small id="file-name" class="file-name"></small>
      <input type="file" id="file" accept="image/*,.tif,.tiff,.tga,.jp2,.j2k,.qoi,.ppm,.pcx" hidden>
    </label>
    <button type="button" class="secondary" id="browse" data-i18n="choose" title="Ctrl+O"></button>
    <p class="note"><span id="accepts"></span><br><span data-i18n="privacy"></span></p>

    <div class="field">
      <label for="count" data-i18n="count"></label>
      <div class="row">
        <button type="button" class="step" id="minus" aria-label="−">−</button>
        <input type="number" id="count" min="1" max="20" value="20" inputmode="numeric">
        <button type="button" class="step" id="plus" aria-label="+">+</button>
        <button type="button" class="ghost" id="auto" data-i18n="auto"></button>
      </div>
    </div>

    <fieldset class="field">
      <legend data-i18n="ratio"></legend>
      <div class="segmented" id="ratio"></div>
    </fieldset>

    <div class="field">
      <label for="fit" data-i18n="fit_mode"></label>
      <select id="fit"></select>
    </div>

    <label class="switch">
      <input type="checkbox" id="optimize" role="switch" checked>
      <span class="track" aria-hidden="true"></span>
      <span><span data-i18n="optimize"></span><small data-i18n="optimize_hint"></small></span>
    </label>

    <div class="actions">
      <button type="button" class="primary" id="save" disabled title="Ctrl+S"></button>
      <button type="button" class="secondary" id="cancel" hidden data-i18n="cancel" title="Esc"></button>
      <button type="button" class="secondary" id="save-dir" disabled data-i18n="save_dir" hidden></button>
      <button type="button" class="secondary" id="open-folder" disabled data-i18n="open_folder" hidden></button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <progress id="progress" max="1" value="0" hidden></progress>
    <p class="note shortcuts" data-i18n="shortcuts"></p>
  </aside>

  <section class="views">
    <div class="view-bar">
      <label for="zoom" data-i18n="zoom"></label>
      <select id="zoom"></select>
    </div>
    <article class="pane">
      <h2><span data-i18n="source"></span> <small data-i18n="source_hint"></small></h2>
      <div class="scroller" id="src-scroll" tabindex="0"><canvas id="src-canvas"></canvas></div>
    </article>
    <article class="pane">
      <h2><span data-i18n="preview"></span> <small data-i18n="preview_hint"></small></h2>
      <div class="scroller" id="prev-scroll" tabindex="0"><canvas id="prev-canvas"></canvas></div>
    </article>
  </section>
</main>

<dialog id="credits">
  <h2 data-i18n="credits"></h2>
  <p data-i18n="credits_body"></p>
  <form method="dialog"><button class="primary" data-i18n="close"></button></form>
</dialog>
</body>
</html>
